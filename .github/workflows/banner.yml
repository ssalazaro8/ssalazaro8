name: Generate Pixel Muneco

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow

      - name: Run pixel muneco script
        run: python scripts/muneco_pixel.py

      - name: Commit GIF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update pixel animation"
          file_pattern: assets/muneco_pixel_final.gif
